# Fail2ban: qualquer requisicao encerrada pelo nginx com status 444.
# O Estilo Marcado usa 444 exclusivamente para scanners/UA suspeitos e caminhos
# sensiveis (ver deploy/nginx/sites-available/... e conf.d/...limits.conf).

[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "[^"]*" 444 \d+
ignoreregex =
