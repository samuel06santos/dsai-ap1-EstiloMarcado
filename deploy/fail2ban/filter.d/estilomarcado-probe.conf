# Fail2ban: varredura de caminhos sensiveis que tenha recebido resposta HTTP
# (4xx), como reforco ao bloqueio 444 do nginx.

[Definition]
failregex = (?i)^<HOST> - \S+ \[[^\]]+\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /[^ "]*?(?:\.env|\.git|\.svn|\.htaccess|wp-admin|wp-login|wp-content|xmlrpc\.php|phpmyadmin|adminer|cgi-bin|/vendor/|\.php\b|\.aspx?\b|\.jsp\b|\.sql\b|\.bak\b|\.old\b|docker-compose)[^ "]* HTTP/[0-9.]+" (?:400|401|403|404|405) \d+
ignoreregex =
