# Configuracao temporaria apenas para emitir o primeiro certificado.
# Habilite, rode o Certbot e depois desabilite (ver deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name estilomarcado.samuelsantos.qzz.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "estilo-marcado: aguardando certificado\n";
    }
}
