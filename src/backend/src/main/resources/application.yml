spring:
  application:
    name: estilo-marcado-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/estilo_marcado}
    username: ${SPRING_DATASOURCE_USERNAME:estilo_marcado}
    password: ${SPRING_DATASOURCE_PASSWORD:estilo-marcado-dev-2026}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:nao-responda@estilomarcado.local}
  auth:
    firebase:
      enabled: ${FIREBASE_AUTH_ENABLED:false}
      import-existing: ${FIREBASE_AUTH_IMPORT_EXISTING:false}
      project-id: ${FIREBASE_PROJECT_ID:}
      web-api-key: ${FIREBASE_WEB_API_KEY:}
      web-auth-domain: ${FIREBASE_WEB_AUTH_DOMAIN:}
      web-app-id: ${FIREBASE_WEB_APP_ID:}
      emulator-browser-url: ${FIREBASE_AUTH_EMULATOR_BROWSER_URL:}
      credentials-path: ${FIREBASE_ADMIN_CREDENTIALS_PATH:}
    password-cost: ${AUTH_PASSWORD_COST:12}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:4200}
    bootstrap:
      enabled: ${AUTH_BOOTSTRAP_ADMIN_ENABLED:false}
      nome: ${AUTH_BOOTSTRAP_ADMIN_NAME:Administrador}
      email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
      email-adicional: ${AUTH_ADDITIONAL_ADMIN_EMAIL:}
      nome-adicional: ${AUTH_ADDITIONAL_ADMIN_NAME:Administrador}
      unidade-id: ${AUTH_BOOTSTRAP_ADMIN_UNIT_ID:0}
      unidade-nome: ${AUTH_BOOTSTRAP_ADMIN_UNIT_NAME:Unidade Administrativa}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
